<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yoga Champion - Yoga Revolution report card</title>
<meta property="og:title" content="My Yoga Revolution report card: Yoga Champion!">
<meta property="og:image" content="yoga-report-card-champion.png">
<style>
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f4f0f8; color:#18518F; text-align:center; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 40px; }
  h1 { font-size:1.6rem; margin:8px 0 16px; }
  img { width:100%; border-radius:24px; box-shadow:0 8px 30px rgba(24,81,143,.2); }
  a.btn { display:inline-block; margin-top:20px; padding:16px 36px; border-radius:40px; background:linear-gradient(90deg,#9E7DB8,#238DC1); color:#fff;
          font-weight:700; font-size:1.2rem; text-decoration:none; letter-spacing:.06em; }
  p.hint { font-size:.95rem; opacity:.8; margin-top:16px; }
</style>
</head>
<body>
<main>
  <h1>Your report card is ready: Yoga Champion!</h1>
  <h1 dir="rtl" lang="ar">بطاقة تقريرك جاهزة: بطل اليوغا!</h1>
  <img src="yoga-report-card-champion.png" alt="Yoga Champion report card">
  <a class="btn" id="dl" href="yoga-report-card-champion.png" download="yoga-report-card-champion.png">Download / تحميل</a>
  <p class="hint">On iPhone: tap and hold the picture, then choose <b>Save to Photos</b>.</p>
  <p class="hint" dir="rtl" lang="ar">على آيفون: اضغط مطولا على الصورة ثم اختر <b>حفظ في الصور</b>.</p>
</main>
<script>
  // start the download automatically (Android / desktop); iOS shows its own download prompt or the image
  window.addEventListener('load', function () {
    setTimeout(function () { document.getElementById('dl').click(); }, 400);
  });
</script>
</body>
</html>
