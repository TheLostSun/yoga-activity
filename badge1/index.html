<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yoga Champion - Yoga Revolution badge</title>
<meta property="og:title" content="I earned the Yoga Champion badge!">
<meta property="og:image" content="yoga-champion-badge.png">
<style>
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f6efe2; color:#54307a; text-align:center; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 40px; }
  h1 { font-size:1.6rem; margin:8px 0 16px; }
  img { width:100%; border-radius:24px; box-shadow:0 8px 30px rgba(84,48,122,.25); }
  a.btn { display:inline-block; margin-top:20px; padding:16px 36px; border-radius:40px; background:#ffcf3f; color:#54307a;
          font-weight:800; font-size:1.2rem; text-decoration:none; box-shadow:0 4px 0 #d9a520; }
  p.hint { font-size:.95rem; opacity:.8; margin-top:16px; }
</style>
</head>
<body>
<main>
  <h1>Your Yoga Champion badge is ready!</h1>
  <img src="yoga-champion-badge.png" alt="Yoga Champion badge">
  <a class="btn" id="dl" href="yoga-champion-badge.png" download="yoga-champion-badge.png">Download badge</a>
  <p class="hint">On iPhone: tap and hold the picture, then choose <b>Save to Photos</b>.</p>
</main>
<script>
  // start the download automatically (Android / desktop); iOS shows its own download prompt or the image
  window.addEventListener('load', function () {
    setTimeout(function () { document.getElementById('dl').click(); }, 400);
  });
</script>
</body>
</html>
